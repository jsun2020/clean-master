[package]
name = "clean-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CleanCLI: fast, safe, portable disk cleaning tool"

[[bin]]
name = "clean"
path = "src/main.rs"

[dependencies]
clean-core = { path = "../clean-core" }
clap = { version = "4", features = ["derive"] }
indicatif = "0.17"
comfy-table = "7"
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
