[workspace]
resolver = "2"
members = ["crates/clean-core", "crates/clean-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
globset = "0.4"
blake3 = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
