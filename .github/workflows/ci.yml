name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Release build (CLI + GUI)
        run: cargo build --release -p clean-cli -p clean-gui

      # macOS only: produce the Clean Master.app bundle and publish it as
      # a downloadable artifact. Zip via ditto so the executable bits and
      # bundle structure survive upload-artifact.
      - name: Bundle Clean Master.app
        if: runner.os == 'macOS'
        run: |
          npm install -g @tauri-apps/cli@^2
          cd crates/clean-gui
          tauri build
          ditto -c -k --keepParent "../../target/release/bundle/macos/Clean Master.app" "../../CleanMaster-macos-arm64.zip"
      - name: Upload .app artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CleanMaster-macos-arm64
          path: CleanMaster-macos-arm64.zip
